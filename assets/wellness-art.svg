<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
<title id="title">Пространство обновления</title><desc id="desc">Абстрактная велнес-композиция: тёплый свет, листья, спокойные волны и камни.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0dca9"/><stop offset=".48" stop-color="#a9bd9b"/><stop offset="1" stop-color="#315b47"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff8dd" stop-opacity=".98"/><stop offset=".42" stop-color="#f8dba0" stop-opacity=".75"/><stop offset="1" stop-color="#f8dba0" stop-opacity="0"/></radialGradient>
 <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#f7d9b6"/><stop offset=".48" stop-color="#d9a57f"/><stop offset="1" stop-color="#9d6b50"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9e2d1"/><stop offset="1" stop-color="#8d9b88"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="640" height="760" rx="300" fill="url(#bg)"/>
